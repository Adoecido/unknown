user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    # Legacy Java routes carry a session token in the path; never log the URI.
    log_format sonyvegas '$remote_addr - $request_method $status $body_bytes_sent '
                          'rt=$request_time ua="$http_user_agent"';
    access_log /var/log/nginx/access.log sonyvegas buffer=32k flush=5s;

    # Freestyle terminates HTTPS at its edge and forwards a trusted client chain.
    # Recursive parsing selects the last untrusted address, so a visitor cannot
    # spoof the limiter by prepending their own X-Forwarded-For value.
    set_real_ip_from 10.0.0.0/8;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    limit_req_zone $binary_remote_addr zone=sv_global:10m rate=50r/s;
    limit_req_zone $binary_remote_addr zone=sv_control:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=sv_admin:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=sv_login:10m rate=2r/m;
    limit_req_zone $binary_remote_addr zone=sv_download:10m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=sv_connections:10m;

    limit_req_status 429;
    limit_conn_status 429;
    client_header_timeout 15s;
    client_body_timeout 30s;
    client_max_body_size 2m;
    keepalive_timeout 20s;
    keepalive_requests 100;
    send_timeout 30s;
    reset_timedout_connection on;

    upstream sonyvegas_backend {
        server 127.0.0.1:8081;
        keepalive 16;
    }

    server {
        listen 8080 default_server;
        server_name _;
        return 444;
    }

    server {
        listen 8080;
        server_name crimsonv2.style.dev localhost 127.0.0.1;

        limit_conn sv_connections 20;
        limit_req zone=sv_global burst=100 nodelay;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-SonyVegas-Client-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header Server;
        proxy_connect_timeout 5s;
        proxy_send_timeout 45s;
        proxy_read_timeout 45s;

        location = /v1/admin/login {
            limit_req zone=sv_login burst=6 nodelay;
            proxy_pass http://sonyvegas_backend;
        }

        location ~ ^/v1/admin/payloads/(release|developer)$ {
            client_max_body_size 6m;
            limit_req zone=sv_admin burst=12 nodelay;
            proxy_pass http://sonyvegas_backend;
        }

        location ~ "^/v1/mappings/cheatbreaker/[0-9a-f]{64}$" {
            client_max_body_size 16m;
            proxy_send_timeout 90s;
            limit_req zone=sv_control burst=6 nodelay;
            proxy_pass http://sonyvegas_backend;
        }

        location /v1/admin/ {
            limit_req zone=sv_admin burst=30 nodelay;
            proxy_pass http://sonyvegas_backend;
        }

        location ~ ^/v1/(control|functions/sonyvegas-auth/executions)$ {
            limit_req zone=sv_control burst=60 nodelay;
            proxy_pass http://sonyvegas_backend;
        }

        location ~ ^/v1/(payloads/(release|developer)/download|storage/buckets/payloads/files/[^/]+/download)$ {
            limit_req zone=sv_download burst=10 nodelay;
            proxy_pass http://sonyvegas_backend;
        }

        location ~ ^/v1/admin/auxiliary/(release|developer)$ {
            client_max_body_size 34m;
            limit_req zone=sv_admin burst=12 nodelay;
            proxy_pass http://sonyvegas_backend;
        }

        # Catalog app published in the panel: serves the authorized profile's
        # track with its real file name (Content-Disposition). The loader
        # reads the name from the response header on every swap.
        location = /downloads/auxiliary {
            limit_req zone=sv_download burst=10 nodelay;
            proxy_pass http://sonyvegas_backend;
        }

        # Compatibility route for the loader self replacement. install.sh
        # verifies the official RARLAB binary before placing it here, so the
        # loader does not depend on an external redirect at cleanup time.
        # The replacement file name no longer depends on WinRAR.
        location = /downloads/winrar {
            limit_req zone=sv_download burst=10 nodelay;
            alias /var/www/sonyvegas-downloads/winrar-x64.exe;
            default_type application/vnd.microsoft.portable-executable;
            add_header Content-Disposition "attachment; filename=WinRAR.exe" always;
            add_header Cache-Control "public, max-age=86400" always;
        }

        location / {
            proxy_pass http://sonyvegas_backend;
        }
    }
}
