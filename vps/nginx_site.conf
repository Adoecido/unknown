server {
    listen 80 default_server;
    server_name 54.94.145.87;
    access_log off;
    limit_req_status 429;
    limit_req_log_level info;
    limit_req zone=unknown_global burst=80 nodelay;
    limit_conn unknown_connections 12;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
    }
    location / { return 301 https://54.94.145.87$request_uri; }
}
server {
    listen 443 ssl default_server;
    server_name 54.94.145.87;
    access_log off;
    ssl_certificate /etc/letsencrypt/live/54.94.145.87/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/54.94.145.87/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 40m;
    limit_req_status 429;
    limit_conn_status 429;
    limit_req_log_level info;
    limit_req zone=unknown_global burst=80 nodelay;
    limit_conn unknown_connections 12;

    location = /v1/admin/login {
        limit_req zone=unknown_global burst=80 nodelay;
        limit_req zone=unknown_login burst=6 nodelay;
        proxy_pass http://127.0.0.1:8081;
        include snippets/unknown_proxy.conf;
    }
    location = /v1/admin/mfa/confirm {
        limit_req zone=unknown_global burst=80 nodelay;
        limit_req zone=unknown_login burst=6 nodelay;
        proxy_pass http://127.0.0.1:8081;
        include snippets/unknown_proxy.conf;
    }
    location = /v1/admin/mfa/setup {
        limit_req zone=unknown_global burst=80 nodelay;
        limit_req zone=unknown_admin burst=20 nodelay;
        proxy_pass http://127.0.0.1:8081;
        include snippets/unknown_proxy.conf;
    }
    location ^~ /v1/admin/ {
        limit_req zone=unknown_global burst=80 nodelay;
        limit_req zone=unknown_admin burst=20 nodelay;
        proxy_pass http://127.0.0.1:8081;
        include snippets/unknown_proxy.conf;
    }
    location = /v1/control {
        limit_req zone=unknown_global burst=80 nodelay;
        limit_req zone=unknown_control burst=60 nodelay;
        proxy_pass http://127.0.0.1:8081;
        include snippets/unknown_proxy.conf;
    }
    location = /v1/functions/sonyvegas-auth/executions {
        limit_req zone=unknown_global burst=80 nodelay;
        limit_req zone=unknown_control burst=60 nodelay;
        proxy_pass http://127.0.0.1:8081;
        include snippets/unknown_proxy.conf;
    }
    location ^~ /v1/downloads/ {
        limit_req zone=unknown_global burst=80 nodelay;
        limit_req zone=unknown_download burst=20 nodelay;
        proxy_pass http://127.0.0.1:8081;
        include snippets/unknown_proxy.conf;
    }
    location / {
        proxy_pass http://127.0.0.1:8081;
        include snippets/unknown_proxy.conf;
    }
}
