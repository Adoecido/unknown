org.gradle.jvmargs=-Xmx1g -Dfile.encoding=UTF-8

# Compile the recovered payload to Java 8 bytecode (major 52) for the MC 1.8.9
# injection target. verifyInjectionPayload rejects anything newer. Overridable
# per-invocation with -PtargetRelease=<n>.
targetRelease=8

# Tell Gradle's toolchain auto-detection where to find locally installed JDKs
# (Zulu 17 is the one the build requires, the others are fallbacks).
org.gradle.java.installations.paths=C:/Program Files/Java/jdk-17,C:/Program Files/Java/jdk1.8.0_202,C:/Program Files/Eclipse Adoptium/jdk-8.0.482.8-hotspot,C:/Program Files/Eclipse Adoptium/jdk-8.0.504.1-hotspot,C:/Program Files/Eclipse Adoptium/jdk-17.0.20.101-hotspot,C:/Program Files/Eclipse Adoptium/jdk-21.0.12.101-hotspot,C:/Program Files (x86)/Zulu/zulu-17,C:/Program Files/Zulu/zulu-21
org.gradle.java.installations.auto-download=false
org.gradle.java.installations.auto-detect=true
