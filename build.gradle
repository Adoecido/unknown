tasks.register('verifySegmentedDisplay') {
    group = 'verification'
    description = 'Fails the build if display text could materialize contiguous module names.'
    doLast {
        def failures = []
        def remoteClient = file('src/main/java/vegas/sony/remote/RemoteControlClient.java')
        remoteClient.eachLine { line, number ->
            if (line.contains('visibleText(')) {
                failures << "RemoteControlClient.java:${number}: visibleText() strips \\u00a7 separators"
            }
        }
        // Module display names must carry //$ or //$ui so the bytecode pass
        // stores them §r-segmented; unmarked names stay contiguous at runtime.
        fileTree('src/main/java/vegas/sony/module') { include '**/*.java' }.files.each { source ->
            if (source.name == 'TextGuiSettingsFrame.java') return
            source.eachLine { line, number ->
                def matcher = line =~ /super\("((?:[^"\\]|\\.)*)"/
                if (matcher.find()) {
                    String name = matcher.group(1)
                    if (!name.endsWith(' //$') && !name.endsWith(' //$ui')) {
                        failures << "${source.name}:${number}: unmarked module super() name"
                    }
                }
            }
        }
        // Category names render in every GUI surface; they must segment.
        file('src/main/java/vegas/sony/module/Category.java').eachLine { line, number ->
            def matcher = line =~ /new Category\("((?:[^"\\]|\\.)*)"/
            if (matcher.find() && !matcher.group(1).endsWith(' //$ui')) {
                failures << "Category.java:${number}: category name must end with //\$ui"
            }
        }
        if (!failures.isEmpty()) {
            throw new GradleException('segmented-display violations:\n' + failures.join('\n'))
        }
        println('segmented display sources verified')
    }
}

def nativeSourceDirectory = file('native')
def nativeBuildDirectory = layout.buildDirectory.dir('native')
def injectionBundleDirectory = layout.buildDirectory.dir('injection')
def productJar = tasks.named('injectionJar', Jar).flatMap { it.archiveFile }
def nativeJavaHome = providers.gradleProperty('nativeJavaHome')
        .orElse(providers.environmentVariable('JAVA_HOME'))
        .orElse('C:/Program Files/Java/jdk1.8.0_301')
def defaultNativeCmakeGenerator = file('C:/Program Files/Microsoft Visual Studio/18').isDirectory()
        ? 'Visual Studio 18 2026'
        : 'Visual Studio 17 2022'
def nativeCmakeGenerator = providers.gradleProperty('nativeCmakeGenerator')
        .orElse(defaultNativeCmakeGenerator)
def vmprotectConsole = providers.gradleProperty('vmprotect.console')
        .orElse('C:/Program Files/VMProtect Ultimate/VMProtect_Con.exe')

tasks.register('configureNative', Exec) {
    group = 'injection'
    description = 'Configures the x64 native DLL and loader with VMProtect.'
    dependsOn(tasks.named('verifyInjectionPayload'))
    inputs.file(productJar)
    inputs.files(fileTree(nativeSourceDirectory) {
        include 'CMakeLists.txt', '*.c', '*.cpp', '*.h', '*.java', '*.py', '*.rc.in', '*.vmp', '*.cmake', 'imgui/**'
        exclude 'legacy_*'
    })
    outputs.file(nativeBuildDirectory.map { it.file('CMakeCache.txt') })
    outputs.file(nativeBuildDirectory.map { it.file('dist/IllIIlIl.dll.vmp') })
    outputs.file(nativeBuildDirectory.map { it.file('dist/unknown.exe.vmp') })
    doFirst {
        commandLine 'cmake',
                '-S', nativeSourceDirectory.absolutePath,
                '-B', nativeBuildDirectory.get().asFile.absolutePath,
                '-G', nativeCmakeGenerator.get(),
                '-A', 'x64',
                "-DSONYVEGAS421_JAVA_HOME=${nativeJavaHome.get()}",
                "-DSONYVEGAS421_VMP_CONSOLE=${file(vmprotectConsole.get()).absolutePath}",
                "-DSONYVEGAS421_PRODUCT_JAR=${productJar.get().asFile.absolutePath}"
    }
}

tasks.register('buildNative', Exec) {
    group = 'injection'
    description = 'Builds and VMProtects the native DLL and loader.'
    dependsOn(tasks.named('configureNative'))
    inputs.file(productJar)
    inputs.files(fileTree(nativeSourceDirectory) {
        include 'CMakeLists.txt', '*.c', '*.cpp', '*.h', '*.java', '*.py', '*.rc.in', '*.vmp', '*.cmake', 'imgui/**'
        exclude 'legacy_*'
    })
    outputs.file(nativeBuildDirectory.map { it.file('dist/IllIIlIl.dll') })
    outputs.file(nativeBuildDirectory.map { it.file('dist/unknown.exe') })
    doFirst {
        commandLine 'cmake', '--build', nativeBuildDirectory.get().asFile.absolutePath,
                '--config', 'Release', '--target', 'SonyVegas421NativeProtected', 'SonyVegas421InjectorProtected'
    }
}

