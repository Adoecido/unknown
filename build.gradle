tasks.register('prepareInjectionBundle', Copy) {
    group = 'injection'
    description = 'Updates the protected DLL and loader in the injection directory.'
    dependsOn(tasks.named('buildNative'), tasks.named('cleanPayloadClasses'))
    from(nativeBuildDirectory.map { it.dir('dist') }) {
        include 'IllIIlIl.dll', 'unknown.exe'
    }
    into(injectionBundleDirectory)
    doLast {
        def dll = injectionBundleDirectory.get().file('IllIIlIl.dll').asFile
        if (!dll.isFile() || dll.length() == 0L) {
            throw new GradleException('native DLL was not produced')
        }
        def loader = injectionBundleDirectory.get().file('unknown.exe').asFile
        if (!loader.isFile() || loader.length() == 0L) {
            throw new GradleException('native loader was not produced')
        }
        println("native DLL and loader updated: ${dll}, ${loader}")
    }
}

tasks.register('protectWithVmProtect') {
    group = 'injection'
    description = 'Builds the DLL and loader with VMProtect; alias for prepareInjectionBundle.'
    dependsOn(tasks.named('prepareInjectionBundle'))
}

tasks.register('zipInjectionBundle', Zip) {
    group = 'injection'
    description = 'Packages the complete injection bundle as one ZIP archive.'
    dependsOn(tasks.named('prepareInjectionBundle'))
    from(injectionBundleDirectory)
    destinationDirectory = layout.buildDirectory.dir('distributions')
    archiveFileName = 'SonyVegas-4.21-bundle.zip'
}
